name: CI for Frontend - Build and Push Docker Image
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 시스템 Docker 설정 (login-action을 위해 검증된 방식)
      - name: Configure Docker Daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["49.50.132.167"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
          sleep 3
          docker info > /dev/null 2>&1 || sleep 3
          echo "--- Docker Daemon Config ---"
          sudo cat /etc/docker/daemon.json
          echo "--------------------------"

      # 2. Harbor 로그인 
      #   - Docker 이미지를 푸시하기 위해 Harbor 레지스트리에 로그인합니다.
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          # registry: Harbor 주소입니다. (http:// 부분은 제외합니다)
          registry: 49.50.132.167
          # username: Harbor 로그인 아이디입니다.
          username: admin
          # password: Harbor 로그인 비밀번호입니다.
          # [경고!] 지금은 학습을 위해 비밀번호를 직접 입력했지만,
          # 실제 프로덕션에서는 반드시 GitHub Secrets (${{ secrets.HARBOR_PASSWORD }})를 사용해야 합니다.
          password: Harbor12345


      # 3. Buildx 설정 (호스트 도커 드라이버 사용)
      - name: Set up buildx (use host docker driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

     
      - name: Set up env settings
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then  
            echo "VITE_API_URL=http://api.jinsoo.ai" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=http://dev.api.jinsoo.ai" >> $GITHUB_ENV
          fi


      # 4. Docker Build and Push
      - name: Build and push Nginx image to Harbor
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 위치
          push: true
          tags: 49.50.132.167/llm-project/frontend:latest # 나중에 고유 태그로 변경
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          # 캐싱 옵션 제거: 안정적인 빌드를 최우선으로 하여 오류 발생 가능성을 줄였습니다.
          # 'cache-to: type=inline' 및 관련 기능 생략

