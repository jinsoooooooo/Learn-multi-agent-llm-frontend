apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-multi-agent-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-multi-agent-frontend
  template:
    metadata:
      labels:
        app: llm-multi-agent-frontend
    spec:
      containers:
        - name: llm-multi-agent-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 80 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort | default 80 }}
            initialDelaySeconds: 15
            timeoutSeconds: 30
            periodSeconds: 360
